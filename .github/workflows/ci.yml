name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # Builds the sample catalog and verifies every link inside the rendered PDF
      - run: npm run catalog
      - uses: actions/upload-artifact@v4
        with:
          name: sample-catalog
          path: dist/catalog.pdf
